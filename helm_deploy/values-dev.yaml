---
# Per environment values which override defaults in hmpps-github-discovery/values.yaml

generic-prometheus-alerts:
  alertSeverity: hmpps-sre-alerts-nonprod

github_discovery:
  env:
    LOG_LEVEL: "DEBUG"
    SC_FILTER: "SC_FILTER"

discoveryCronJob:
  enabled: false
  cron:
    github_discovery: "05 10 * * 0"
    github_discovery_full: "20 * * * *"

teamsCronJob:
  enabled: false
  cron:
    github_teams_discovery: "35 10 * * *"

securityCronJob:
  enabled: false
  cron:
    github_discovery_security: "30 18 * * 1-5"

workflowsCronJob:
  enabled: false
  cron:
    github_discovery_workflows: "40 * * * 4"

dependenciesCronJob:
  enabled: false
  cron:
    github_discovery_dependencies_latest: "50 18 * * *"
